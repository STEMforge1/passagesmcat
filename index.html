<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Passage 1 Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
html{color-scheme:light}[hidden]{display:none!important}
/* Layout: passage pinned left on wide screens, questions scroll beside it; single column on phones */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202e; --muted:#5b6678; --line:#d9dfe8;
  --accent:#1f4fd8; --accent-soft:#e4ebfc;
  --good:#17743f; --good-soft:#dff3e7; --bad:#b3261e; --bad-soft:#fbe4e2;
  --serif:"Newsreader",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141d; --surface:#171e2a; --fg:#e6ebf3; --muted:#97a3b8; --line:#2a3445;
  --accent:#7ea0ff; --accent-soft:#1d2a4d; --good:#5fd18c; --good-soft:#12301f; --bad:#ff8a80; --bad-soft:#3a1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#171e2a; --fg:#e6ebf3; --muted:#97a3b8; --line:#2a3445;
  --accent:#7ea0ff; --accent-soft:#1d2a4d; --good:#5fd18c; --good-soft:#12301f; --bad:#ff8a80; --bad-soft:#3a1b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{max-width:1680px;margin:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font:600 1.05rem var(--sans);margin:0;letter-spacing:.01em}
.bar{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
button{font:inherit;color:inherit}
.reset,.theme{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer}
.reset:hover,.theme:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1680px;margin:16px auto 0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.passage{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 28px}
.passage h2{font:600 .75rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.passage p{font:400 1.12rem/1.65 var(--serif);margin:0 0 12px}
figure{margin:0}
figure img{display:block;max-width:100%;height:auto;margin:auto;background:#fff;border-radius:6px}
figcaption{font-size:.8rem;color:var(--muted);margin-top:6px;font-style:italic}
.qs{display:flex;flex-direction:column;gap:20px;min-width:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qn{font:500 .75rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stem{font-weight:500;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;background:var(--surface)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.good{background:var(--good-soft);border-color:var(--good)}
.opt.good .l{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}
.check,.checkall{background:var(--accent);color:var(--surface);border:0;border-radius:6px;padding:8px 16px;font-weight:500;cursor:pointer}
.check:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.done p{margin:0 0 12px}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:.92rem;color:var(--fg)}
.why b{display:block;margin-bottom:2px}
.why.ok b{color:var(--good)} .why.no b{color:var(--bad)}
.done{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:20px;text-align:center}
.done b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.pfig{margin:4px 0 16px}.pfig img{max-width:min(100%,460px)}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .passage{position:static;max-height:none}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

eactivate 37xc?", "opts": ["Phosphorylation", "Dephosphorylation", "Glycosylation", "Acetylation"], "fig": null, "ans": 1, "why": "The downstream enzyme adds a covalent group that activates 37xc, which fits phosphorylation. Removing it by dephosphorylation reverses the activation."}, {"stem": "Which of the following best explains why the loss of functional 37xc had little impact on the health of the 37xc(-) mice?", "opts": ["Loss of 37xc raises transcript levels of its target genes, and the elevated ncRNA binds this mRNA post-transcriptionally and inhibits further translation", "A second nuclear factor is upregulated and binds the DNA-RNA polymerase complex in place of 37xc, keeping transcript levels of its target genes normal", "The truncated protein retains partial activity at the DNA-RNA polymerase complex, which keeps transcript levels of its target genes close to normal", "The elevated ncRNA increases transcription of the 37xc gene, restoring enough full-length protein to keep transcript levels of its target genes normal"], "fig": null, "ans": 0, "why": "37xc inhibits transcription, so losing it raises transcripts of its targets. The elevated ncRNA then binds that mRNA after transcription and blocks translation, which keeps protein output near normal. The other choices do not account for the elevated ncRNA."}, {"stem": "In the mRNA strand encoding one alpha subunit, 1920 nucleotides are present within the reading frame. How many amino acids are in the initial polypeptide?", "opts": ["638", "640", "641", "639"], "fig": null, "ans": 3, "why": "1920 nucleotides is 640 codons. One codon is the stop codon, which does not code for an amino acid, so the polypeptide has 639 amino acids."}, {"stem": "Suppose a scientist accidentally introduced a mutation into the coding strand instead of the noncoding strand of the gene. How would the protein produced from the next round of transcription of this gene be affected?", "opts": ["The protein would be truncated", "The protein would form normally", "The protein would have a frameshift", "The protein would have a single amino acid substitution"], "fig": null, "ans": 1, "why": "RNA polymerase reads the noncoding (template) strand. A mutation in the coding strand leaves the template unchanged, so the next transcript, and the protein made from it, is normal."}, {"stem": "What is the likely role of this protein?", "opts": ["Receptor kinase", "Ribosomal component", "Transcription factor", "Second messenger"], "fig": null, "ans": 2, "why": "37xc is a nuclear factor that binds the DNA-RNA polymerase complex to affect mRNA production. That describes a transcription factor."}, {"stem": "A researcher conducts a non-reducing SDS-PAGE to analyze the subunits. Which gel shows what the researcher would see for 37xc?", "opts": ["Gel A", "Gel B", "Gel C", "Gel D"], "fig": {"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABcIAAALWCAYAAABlbuDXAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAh1QAAIdUBBJy0nQAAbtBJREFUeJzs/Xd0Xed9J3p/ARAkCBJg703salQvFNV7oS2X2LEzbnJiz5u5ebMyyV1J1np9MzP3zk3WnZl7151kZSZlkkniuMS2LMlWs5olSxZFShTFTrF3UuxEYQMI4P2DJkwYIAVSROHm57OWloS9n73P71CHP5z9Pc95dklLS0tLAAAAAACgoEp7ugAAAAAAAOhKgnAAAAAAAApNEA4AAAAAQKEJwgEAAAAAKDRBOAAAAAAAhSYIBwAAAACg0AThAAAAAAAUmiAcAAAAAIBCE4QDAAAAAFBognAAAAAAAApNEA4AAAAAQKEJwgEAAAAAKDRBOAAAAAAAhSYIBwAAAACg0AThAAAAAAAUmiAcAAAAAIBCE4QDAAAAAFBognAAAAAAAApNEA4AAAAAQKEJwgEAAAAAKDRBOAAAAAAAhSYIBwAAAACg0AThAAAAAAAUmiAcAAAAAIBCE4QDAAAAAFBognAAAAAAAApNEA4AAAAAQKEJwgEAAAAAKDRBOAAAAAAAhSYIBwAAAACg0AThAAAAAAAUmiAcAAAAAIBCE4QDAAAAAFBognAAAAAAAApNEA4AAAAAQKEJwgEAAAAAKDRBOAAAAAAAhSYIBwAAAACg0AThAAAAAAAUWp+eLgAAAADOVUNDQ/bu3Zv9+/enoqIiw4YNy5AhQ3q6LACglxGEA13uD//wD/Pqq692uO873/lOZsyY0c0VAfS8p59+Ov/7//6/f+i4fv36ZcKECZk0aVImTZqUBx54INOmTeuGCgF6r/379+c73/lOXnnllbz77rtpampqs3/ChAm55ZZb8oUvfCE33HBDD1UJ0L0OHjyY++6774xjSkpKMnjw4AwbNiyTJk3K7bffnttuuy2DBw/uniKhB5W0tLS09HQRQHEdPnw4V111VY4cOdLh/t/7vd/LH/3RH3VzVQA97/vf/35+//d//5y const P=document.getElementById('passage'),Q=document.getElementById('qs');
let sel=new Array(D.qs.length).fill(null),chk=new Array(D.qs.length).fill(false);
const save=()=>{try{localStorage.setItem('p1quiz2',JSON.stringify({sel,chk}))}catch(_){}};
function render(){
  P.innerHTML='<h2>Passage</h2>'+D.passage.map((p,i)=>'<p>'+p+'</p>'+(i===0?'<figure class="pfig"><img src="'+D.fig+'" alt="Two alpha and two beta subunits in a square, linked by disulfide bonds"><figcaption>Figure 1. Subunit structure of protein 37xc. Disulfide bonds link the subunits.</figcaption></figure>':'')).join('');
  Q.innerHTML='';
  D.qs.forEach((q,qi)=>{
    const a=sel[qi],done=chk[qi],el=document.createElement('section');el.className='q';
    let h='<div class="qn">Question '+(qi+1)+' of '+D.qs.length+'</div><p class="stem">'+q.stem+'</p>';
    if(q.fig)h+='<figure><img src="'+q.fig.src+'" alt="">'+(q.fig.cap?'<figcaption>'+q.fig.cap+'</figcaption>':'')+'</figure>';
    h+='<div class="opts">'+q.opts.map((o,oi)=>{
      let c='opt';
      if(done){if(oi===q.ans)c+=' good';else if(oi===a)c+=' bad';else c+=' dim'}
      else if(oi===a)c+=' sel';
      return '<button type="button" class="'+c+'" data-q="'+qi+'" data-o="'+oi+'"'+(done?' disabled':'')+' aria-pressed="'+(oi===a)+'"><span class="l">'+'ABCD'[oi]+'</span><span class="t">'+o+'</span></button>'}).join('')+'</div>';
    if(!done)h+='<div class="row"><button type="button" class="check" data-check="'+qi+'"'+(a===null?' disabled':'')+'>Check answer</button>'+(a===null?'<span class="hint">Choose an answer first</span>':'')+'</div>';
    else{const ok=a===q.ans;h+='<div class="why '+(ok?'ok':'no')+'"><b>'+(ok?'Correct':(a===null?'Skipped. The answer is ':'Not quite. The answer is ')+'ABCD'[q.ans])+(ok?'':'')+'</b>'+q.why+'</div>'}
    el.innerHTML=h;Q.appendChild(el);
  });
  const n=sel.filter(x=>x!==null).length,k=chk.filter(Boolean).length,c=chk.reduce((t,d,i)=>t+(d&&sel[i]===D.qs[i].ans?1:0),0);
  document.getElementById('score').textContent=k===D.qs.length?'Final score '+c+' of '+D.qs.length:n+' of '+D.qs.length+' answered'+(k?', '+c+' of '+k+' checked correct':'');
  document.getElementById('pbi').style.width=(n/D.qs.length*100)+'%';
  if(k<D.qs.length){const d=document.createElement('div');d.className='done';d.innerHTML='<p>'+n+' of '+D.qs.length+' answered. Check everything at once when you are finished.</p><button type="button" class="checkall" id="checkall">Check all answers</button>';Q.appendChild(d)}
  else{const d=document.createElement('div');d.className='done';d.innerHTML='<b>'+c+' / '+D.qs.length+'</b><br>'+(c===D.qs.length?'Perfect score.':'Review the explanations above, then reset to try again.');Q.appendChild(d)}
}
Q.addEventListener('click',e=>{
  const y=window.scrollY;
  const b=e.target.closest('.opt');
  if(b&&!b.disabled){sel[+b.dataset.q]=+b.dataset.o;save();render();window.scrollTo(0,y);return}
  const c=e.target.closest('[data-check]');
  if(c&&sel[+c.dataset.check]!==null){chk[+c.dataset.check]=true;save();render();window.scrollTo(0,y);return}
  if(e.target.closest('#checkall')){chk=chk.map(()=>true);save();render();window.scrollTo(0,y)}
});
document.getElementById('reset').onclick=()=>{sel=sel.map(()=>null);chk=chk.map(()=>false);try{localStorage.removeItem('p1quiz2')}catch(_){}render();window.scrollTo(0,0)};
try{const s=JSON.parse(localStorage.getItem('p1quiz2')||'null');if(s&&s.sel&&s.sel.length===sel.length){sel=s.sel;chk=s.chk}}catch(_){}
const root=document.documentElement,tb=document.getElementById('theme');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function syncT(){tb.textContent=isDark()?'Light mode':'Dark mode'}
try{const t=localStorage.getItem('p1theme');if(t)root.dataset.theme=t}catch(_){}
tb.onclick=()=>{const t=isDark()?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('p1theme',t)}catch(_){}syncT()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncT);
syncT();render();
</script>
